<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Retro Pixel Clock Final Ghost 88</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}
#stage{
  position:absolute;
  left:50%;
  top:50%;
  width:1024px;
  height:768px;
  margin-left:-512px;
  margin-top:-384px;
  background:#000;
  overflow:hidden;
  -webkit-transform-origin:50% 50%;
  transform-origin:50% 50%;
}
#ghostLayer,#activeLayer,#bottomLayer,#colonLayer{
  position:absolute;
  left:0;
  top:0;
  width:1024px;
  height:768px;
}
.ghostPixel{
  position:absolute;
  width:32px;
  height:32px;
  background:rgba(0,95,95,.28);
  box-shadow:0 0 5px rgba(0,120,120,.14);
}
.activePixel{
  position:absolute;
  width:32px;
  height:32px;
  background:#5CFFFF;
  box-shadow:
    0 0 8px rgba(80,255,255,.95),
    0 0 18px rgba(0,220,220,.42);
}
.smallGhost{
  position:absolute;
  background:rgba(0,95,95,.22);
}
.smallActive{
  position:absolute;
  background:#5CFFFF;
  box-shadow:
    0 0 4px rgba(80,255,255,.90),
    0 0 9px rgba(0,220,220,.35);
}
.colonGhost{
  position:absolute;
  width:32px;
  height:32px;
  background:rgba(0,95,95,.28);
  box-shadow:0 0 5px rgba(0,120,120,.14);
}
.colonActive{
  position:absolute;
  width:32px;
  height:32px;
  background:#5CFFFF;
  box-shadow:
    0 0 8px rgba(80,255,255,.95),
    0 0 18px rgba(0,220,220,.42);
  -webkit-animation:colonPulse 1s ease-in-out infinite;
  animation:colonPulse 1s ease-in-out infinite;
}
@-webkit-keyframes colonPulse{
  0%{opacity:1}
  50%{opacity:.08}
  100%{opacity:1}
}
@keyframes colonPulse{
  0%{opacity:1}
  50%{opacity:.08}
  100%{opacity:1}
}
</style>
</head>
<body>
<div id="stage">
  <div id="ghostLayer"></div>
  <div id="activeLayer"></div>
  <div id="colonLayer"></div>
  <div id="bottomLayer"></div>
</div>

<script>
(function(){
  var stage=document.getElementById("stage");
  var ghostLayer=document.getElementById("ghostLayer");
  var activeLayer=document.getElementById("activeLayer");
  var colonLayer=document.getElementById("colonLayer");
  var bottomLayer=document.getElementById("bottomLayer");

  /* Fixed 5x9 matrix: every digit occupies the same exact slot */
  var DIG={
    "0":["01110","10001","10011","10101","10101","11001","10001","10001","01110"],
    "1":["00100","01100","10100","00100","00100","00100","00100","00100","11111"],
    "2":["01110","10001","00001","00001","00010","00100","01000","10000","11111"],
    "3":["11110","00001","00001","00001","01110","00001","00001","00001","11110"],
    "4":["00010","00110","01010","10010","10010","11111","00010","00010","00010"],
    "5":["11111","10000","10000","10000","11110","00001","00001","00001","11110"],
    "6":["01110","10000","10000","10000","11110","10001","10001","10001","01110"],
    "7":["11111","00001","00010","00010","00100","00100","01000","01000","01000"],
    "8":["01110","10001","10001","10001","01110","10001","10001","10001","01110"],
    "9":["01110","10001","10001","10001","01111","00001","00001","00001","01110"]
  };

  var FONT={
    "0":["01110","10001","10011","10101","11001","10001","01110"],
    "1":["00100","01100","00100","00100","00100","00100","01110"],
    "2":["01110","10001","00001","00010","00100","01000","11111"],
    "3":["11110","00001","00001","01110","00001","00001","11110"],
    "4":["00010","00110","01010","10010","11111","00010","00010"],
    "5":["11111","10000","10000","11110","00001","00001","11110"],
    "6":["01110","10000","10000","11110","10001","10001","01110"],
    "7":["11111","00001","00010","00100","01000","01000","01000"],
    "8":["01110","10001","10001","01110","10001","10001","01110"],
    "9":["01110","10001","10001","01111","00001","00001","01110"],
    "A":["01110","10001","10001","11111","10001","10001","10001"],
    "B":["11110","10001","10001","11110","10001","10001","11110"],
    "C":["01111","10000","10000","10000","10000","10000","01111"],
    "D":["11110","10001","10001","10001","10001","10001","11110"],
    "E":["11111","10000","10000","11110","10000","10000","11111"],
    "F":["11111","10000","10000","11110","10000","10000","10000"],
    "G":["01111","10000","10000","10111","10001","10001","01111"],
    "H":["10001","10001","10001","11111","10001","10001","10001"],
    "I":["11111","00100","00100","00100","00100","00100","11111"],
    "J":["00111","00010","00010","00010","10010","10010","01100"],
    "K":["10001","10010","10100","11000","10100","10010","10001"],
    "L":["10000","10000","10000","10000","10000","10000","11111"],
    "M":["10001","11011","10101","10101","10001","10001","10001"],
    "N":["10001","11001","10101","10011","10001","10001","10001"],
    "O":["01110","10001","10001","10001","10001","10001","01110"],
    "P":["11110","10001","10001","11110","10000","10000","10000"],
    "Q":["01110","10001","10001","10001","10101","10010","01101"],
    "R":["11110","10001","10001","11110","10100","10010","10001"],
    "S":["01111","10000","10000","01110","00001","00001","11110"],
    "T":["11111","00100","00100","00100","00100","00100","00100"],
    "U":["10001","10001","10001","10001","10001","10001","01110"],
    "V":["10001","10001","10001","10001","10001","01010","00100"],
    "W":["10001","10001","10001","10101","10101","10101","01010"],
    "X":["10001","10001","01010","00100","01010","10001","10001"],
    "Y":["10001","10001","01010","00100","00100","00100","00100"],
    "Z":["11111","00001","00010","00100","01000","10000","11111"],
    " ":["00000","00000","00000","00000","00000","00000","00000"]
  };

  var CELL=34;
  var TIME_Y=118;
  var POS=[87,291,563,767];

  function add(layer,cls,x,y,w,h){
    var e=document.createElement("div");
    e.className=cls;
    e.style.left=Math.round(x)+"px";
    e.style.top=Math.round(y)+"px";
    if(w){
      e.style.width=Math.round(w)+"px";
      e.style.height=Math.round(h)+"px";
    }
    layer.appendChild(e);
  }

  function drawMatrix(layer,glyph,x,y,cls){
    var r,c;
    for(r=0;r<glyph.length;r++){
      for(c=0;c<5;c++){
        if(glyph[r].charAt(c)==="1"){
          add(layer,cls,x+c*CELL,y+r*CELL);
        }
      }
    }
  }

  /* TRUE retro ghost: faint 8 is permanently visible in every digit slot */
  function drawGhost88(){
    var i;
    for(i=0;i<4;i++){
      drawMatrix(ghostLayer,DIG["8"],POS[i],TIME_Y,"ghostPixel");
    }
  }

  function drawTime(){
    activeLayer.innerHTML="";
    var d=new Date();
    var hh=d.getHours(), mm=d.getMinutes();
    var H=(hh<10?"0":"")+hh;
    var M=(mm<10?"0":"")+mm;

    drawMatrix(activeLayer,DIG[H.charAt(0)],POS[0],TIME_Y,"activePixel");
    drawMatrix(activeLayer,DIG[H.charAt(1)],POS[1],TIME_Y,"activePixel");
    drawMatrix(activeLayer,DIG[M.charAt(0)],POS[2],TIME_Y,"activePixel");
    drawMatrix(activeLayer,DIG[M.charAt(1)],POS[3],TIME_Y,"activePixel");
  }

  function drawColon(){
    var x=496;
    var y1=TIME_Y+96;
    var y2=TIME_Y+204;

    add(colonLayer,"colonGhost",x,y1);
    add(colonLayer,"colonGhost",x,y2);
    add(colonLayer,"colonActive",x,y1);
    add(colonLayer,"colonActive",x,y2);
  }

  function textWidth(txt,s){
    return txt.length*5*s+(txt.length-1)*s;
  }

  function drawSmallText(txt,cx,y,s){
    var start=cx-textWidth(txt,s)/2;
    var i,r,c,g,x,yy;
    for(i=0;i<txt.length;i++){
      g=FONT[txt.charAt(i)]||FONT[" "];
      for(r=0;r<7;r++){
        for(c=0;c<5;c++){
          if(g[r].charAt(c)==="1"){
            x=start+i*6*s+c*s;
            yy=y+r*s;
            add(bottomLayer,"smallGhost",x+s*.75,yy+s*.75,s-2,s-2);
            add(bottomLayer,"smallActive",x,yy,s-2,s-2);
          }
        }
      }
    }
  }

  function drawBottom(){
    bottomLayer.innerHTML="";
    var d=new Date();
    var DAYS=["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
    var MON=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
    var dd=d.getDate();
    var ds=(dd<10?"0":"")+dd;

    drawSmallText(ds,155,600,10);
    drawSmallText(DAYS[d.getDay()],512,615,6);
    drawSmallText(MON[d.getMonth()],869,600,10);
  }

  function fit(){
    var w=window.innerWidth||document.documentElement.clientWidth||1024;
    var h=window.innerHeight||document.documentElement.clientHeight||768;
    var s=Math.min(w/1024,h/768);
    stage.style.webkitTransform="scale("+s+")";
    stage.style.transform="scale("+s+")";
  }

  drawGhost88();
  drawColon();
  drawTime();
  drawBottom();
  fit();

  setInterval(function(){
    drawTime();
    drawBottom();
  },1000);

  window.addEventListener("resize",fit,false);
  window.addEventListener("orientationchange",function(){setTimeout(fit,250);},false);
})();
</script>
</body>
</html>
