<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Retro Pixel Clock - Strong Pulse</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}
#wrap{
  position:absolute;
  left:0; top:0; right:0; bottom:0;
  background:#000;
}
canvas{
  position:absolute;
  left:50%;
  top:50%;
  width:1024px;
  height:768px;
  margin-left:-512px;
  margin-top:-384px;
  -webkit-transform-origin:50% 50%;
  transform-origin:50% 50%;
  background:#000;
}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1024" height="768"></canvas></div>

<script>
(function(){
  var canvas=document.getElementById('c');
  var ctx=canvas.getContext('2d');

  var CYAN="#5CFFFF";
  var SHADOW="rgba(0,115,115,.30)";
  var GLOW1="rgba(80,255,255,.85)";
  var GLOW2="rgba(0,220,220,.32)";

  /* bottom 5x7 bitmap font */
  var F={
    "0":["01110","10001","10011","10101","11001","10001","01110"],
    "1":["00100","01100","00100","00100","00100","00100","01110"],
    "2":["01110","10001","00001","00010","00100","01000","11111"],
    "3":["11110","00001","00001","01110","00001","00001","11110"],
    "4":["00010","00110","01010","10010","11111","00010","00010"],
    "5":["11111","10000","10000","11110","00001","00001","11110"],
    "6":["01110","10000","10000","11110","10001","10001","01110"],
    "7":["11111","00001","00010","00100","01000","01000","01000"],
    "8":["01110","10001","10001","01110","10001","10001","01110"],
    "9":["01110","10001","10001","01111","00001","00001","01110"],
    "A":["01110","10001","10001","11111","10001","10001","10001"],
    "B":["11110","10001","10001","11110","10001","10001","11110"],
    "C":["01111","10000","10000","10000","10000","10000","01111"],
    "D":["11110","10001","10001","10001","10001","10001","11110"],
    "E":["11111","10000","10000","11110","10000","10000","11111"],
    "F":["11111","10000","10000","11110","10000","10000","10000"],
    "G":["01111","10000","10000","10111","10001","10001","01111"],
    "H":["10001","10001","10001","11111","10001","10001","10001"],
    "I":["11111","00100","00100","00100","00100","00100","11111"],
    "J":["00111","00010","00010","00010","10010","10010","01100"],
    "K":["10001","10010","10100","11000","10100","10010","10001"],
    "L":["10000","10000","10000","10000","10000","10000","11111"],
    "M":["10001","11011","10101","10101","10001","10001","10001"],
    "N":["10001","11001","10101","10011","10001","10001","10001"],
    "O":["01110","10001","10001","10001","10001","10001","01110"],
    "P":["11110","10001","10001","11110","10000","10000","10000"],
    "Q":["01110","10001","10001","10001","10101","10010","01101"],
    "R":["11110","10001","10001","11110","10100","10010","10001"],
    "S":["01111","10000","10000","01110","00001","00001","11110"],
    "T":["11111","00100","00100","00100","00100","00100","00100"],
    "U":["10001","10001","10001","10001","10001","10001","01110"],
    "V":["10001","10001","10001","10001","10001","01010","00100"],
    "W":["10001","10001","10001","10101","10101","10101","01010"],
    "X":["10001","10001","01010","00100","01010","10001","10001"],
    "Y":["10001","10001","01010","00100","00100","00100","00100"],
    "Z":["11111","00001","00010","00100","01000","10000","11111"],
    " ":["00000","00000","00000","00000","00000","00000","00000"]
  };

  var SEG={
    "0":[1,1,1,0,1,1,1],
    "1":[0,0,1,0,0,1,0],
    "2":[1,0,1,1,1,0,1],
    "3":[1,0,1,1,0,1,1],
    "4":[0,1,1,1,0,1,0],
    "5":[1,1,0,1,0,1,1],
    "6":[1,1,0,1,1,1,1],
    "7":[1,0,1,0,0,1,0],
    "8":[1,1,1,1,1,1,1],
    "9":[1,1,1,1,0,1,1]
  };

  function block(x,y,s,shadow){
    if(shadow){
      ctx.fillStyle=SHADOW;
      ctx.fillRect(Math.round(x+s*.72),Math.round(y+s*.72),Math.round(s-2),Math.round(s-2));
      return;
    }
    ctx.save();
    ctx.shadowColor=GLOW1;
    ctx.shadowBlur=8;
    ctx.fillStyle=CYAN;
    ctx.fillRect(Math.round(x),Math.round(y),Math.round(s-2),Math.round(s-2));
    ctx.shadowBlur=16;
    ctx.shadowColor=GLOW2;
    ctx.fillRect(Math.round(x),Math.round(y),Math.round(s-2),Math.round(s-2));
    ctx.restore();
  }

  function hseg(x,y,n,s){
    var i;
    for(i=0;i<n;i++){ block(x+i*s,y,s,true); }
    for(i=0;i<n;i++){ block(x+i*s,y,s,false); }
  }
  function vseg(x,y,n,s){
    var i;
    for(i=0;i<n;i++){ block(x,y+i*s,s,true); }
    for(i=0;i<n;i++){ block(x,y+i*s,s,false); }
  }

  /* proportions tuned to match the approved final mockup on 1024x768 */
  var CELL=25;
  var DW=175;
  var DH=350;

  function digit(ch,x,y){
    var a=SEG[ch]||SEG["0"];
    var topX=x+25, topY=y;
    var midY=y+162;
    var botY=y+324;
    var leftX=x, rightX=x+150;

    if(a[0]) hseg(topX,topY,5,CELL);
    if(a[1]) vseg(leftX,y+25,5,CELL);
    if(a[2]) vseg(rightX,y+25,5,CELL);
    if(a[3]) hseg(topX,midY,5,CELL);
    if(a[4]) vseg(leftX,midY+25,5,CELL);
    if(a[5]) vseg(rightX,midY+25,5,CELL);
    if(a[6]) hseg(topX,botY,5,CELL);
  }

  function colon(x,y,pulse){
    /* Shadow remains visible; only the bright cyan colon breathes. */
    block(x,y+118,30,true);
    block(x,y+220,30,true);

    ctx.save();
    ctx.globalAlpha = pulse;
    block(x,y+118,30,false);
    block(x,y+220,30,false);
    ctx.restore();
  }

  function textWidth(txt,s){
    if(!txt.length)return 0;
    return txt.length*5*s+(txt.length-1)*s;
  }

  function smallText(txt,cx,y,s){
    var w=textWidth(txt,s), start=cx-w/2;
    var i,r,c,g,x;
    for(i=0;i<txt.length;i++){
      g=F[txt.charAt(i)]||F[" "];
      for(r=0;r<7;r++){
        for(c=0;c<5;c++){
          if(g[r].charAt(c)==="1"){
            x=start+i*6*s+c*s;
            ctx.fillStyle="rgba(0,115,115,.25)";
            ctx.fillRect(Math.round(x+s*.8),Math.round(y+r*s+s*.8),s-2,s-2);
            ctx.save();
            ctx.shadowColor=GLOW1;
            ctx.shadowBlur=4;
            ctx.fillStyle=CYAN;
            ctx.fillRect(Math.round(x),Math.round(y+r*s),s-2,s-2);
            ctx.restore();
          }
        }
      }
    }
  }

  function render(){
    ctx.clearRect(0,0,1024,768);
    ctx.fillStyle="#000";
    ctx.fillRect(0,0,1024,768);

    var d=new Date();
    var hh=d.getHours(), mm=d.getMinutes();
    var H=(hh<10?"0":"")+hh, M=(mm<10?"0":"")+mm;

    /* final layout: generous side margins, time centered, bottom row closer */
    digit(H.charAt(0),60,115);
    digit(H.charAt(1),255,115);
    /* Strong, clearly visible smooth pulse: 100% -> 5% -> 100%. */
    var t = (new Date().getTime() % 1000) / 1000;
    var pulse = 0.05 + 0.95 * ((Math.cos(t * Math.PI * 2) + 1) / 2);
    colon(487,115,pulse);
    digit(M.charAt(0),590,115);
    digit(M.charAt(1),785,115);

    var DAYS=["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
    var MON=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
    var dd=d.getDate(), date=(dd<10?"0":"")+dd;

    smallText(date,155,620,10);
    smallText(DAYS[d.getDay()],512,634,6);
    smallText(MON[d.getMonth()],869,620,10);
  }

  function fit(){
    var w=window.innerWidth||document.documentElement.clientWidth||1024;
    var h=window.innerHeight||document.documentElement.clientHeight||768;
    var s=Math.min(w/1024,h/768);
    canvas.style.webkitTransform="scale("+s+")";
    canvas.style.transform="scale("+s+")";
  }

  fit();
  render();
  setInterval(render,33);
  window.addEventListener("resize",fit,false);
  window.addEventListener("orientationchange",function(){setTimeout(fit,250);},false);
})();
</script>
</body>
</html>
